[package]
name = "agent-config-manager"
version = "1.2.0"
edition = "2021"
authors = ["Daisuke Yamashiki"]
description = "Cross-agent configuration manager for MCP servers and skills with interactive TUI"
license = "MIT"
repository = "https://github.com/yama662607/agent-config-manager"

[lib]
name = "agent_config_manager"
path = "src-rust/lib.rs"

[[bin]]
name = "acm"
path = "src-rust/main.rs"

[dependencies]
# CLI & Args
clap = { version = "4.5", features = ["derive", "env"] }

# TUI & Terminal
ratatui = { version = "0.29", features = ["all-widgets", "crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
fuzzy-matcher = "0.3"

# Serialization & Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"

# Async & Filesystem
tokio = { version = "1.40", features = ["full"] }
walkdir = "2.5"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
regex = "1.10"

[dev-dependencies]
tempfile = "3.12"
assert_cmd = "2.0"
predicates = "3.1"
