[package]
name = "agent-config-manager"
version = "1.3.0"
edition = "2021"
authors = ["Daisuke Yamashiki"]
description = "Cross-agent configuration manager for MCP servers and skills with interactive TUI"
license = "MIT"
repository = "https://github.com/yama662607/agent-config-manager"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "README_JA.md", "LICENSE"]

[lib]
name = "agent_config_manager"
path = "src/lib.rs"

[[bin]]
name = "acm"
path = "src/main.rs"

[dependencies]
# CLI & Args
clap = { version = "4.5", features = ["derive", "env"] }

# TUI & Terminal
ratatui = { version = "0.29", features = ["all-widgets", "crossterm"] }
crossterm = "0.28"
unicode-width = "0.2"
fuzzy-matcher = "0.3"

# Serialization & Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"

# Async & Filesystem
walkdir = "2.5"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
anyhow = "1.0"
regex = "1.10"
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
toml_edit = { version = "0.22", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }


[profile.release]
lto = "thin"
strip = true
