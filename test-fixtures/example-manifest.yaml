version: 1
targets:
  claude:
    enabled: true
  codex:
    enabled: true
servers:
  context7:
    transport: stdio
    command: npx
    args:
      - -y
      - "@upstash/context7-mcp"
    targets:
      - claude
      - codex
  sentry:
    transport: http
    url: https://mcp.sentry.dev/mcp
    headers:
      Authorization: ${SENTRY_AUTH_HEADER}
    targets:
      - claude
      - codex
